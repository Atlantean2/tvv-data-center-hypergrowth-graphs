<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q2</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Maps</h2><figure class="g"><img src="img/03a_map_us_campuses.webp" alt="Major AI data-center campuses — United States (bubble = MW; red = project-level debt/lease financing disclosed)" loading="lazy"><figcaption><span class="t">Major AI data-center campuses — United States (bubble = MW; red = project-level debt/lease financing disclosed)</span><ul><li>Meta Hyperion (Louisiana) is financed through an SPV. Beignet Investor sold $27.3B of 6.581% notes due 2049, rated A+, and PIMCO took about $18B. Blue Owl owns 80% and Meta 20%. Meta leases the campus back and gives a residual value guarantee (RVG), which S&amp;P called key to the rating. <a href="https://investor.atmeta.com/investor-news/press-release-details/2025/Meta-Announces-Joint-Venture-with-Funds-Managed-by-Blue-Owl-Capital-to-Develop-Hyperion-Data-Center/default.aspx">(source)</a></li><li>Meta El Paso copies the structure: a $14B, 1 GW joint venture, 80% BlackRock, with about $12.5B of secured debt and an RVG of about $13B. <a href="https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Announces-New-Strategic-Venture-with-BlackRock-to-Develop-Data-Center-in-El-Paso/">(source)</a></li><li>Oracle/OpenAI Stargate is mostly financed through partner developers. Vantage has a $38B loan, the STACK New Mexico site an $18B bank loan, and Related Michigan a $16.3B package of about $14B in 7.5% bonds plus equity. Total partner debt is about $72B. <a href="https://octus.com/resources/articles/banks-prep-series-of-multibillion-dollar-debt-offerings-for-oracle/">(source)</a></li></ul><p>Source: Epoch AI; aidatacenterindex.com; company filings/press (see xlsx). Locations approximate, hand-geocoded.<br><a href="https://epoch.ai/data/data-centers">https://epoch.ai/data/data-centers</a> <a href="https://aidatacenterindex.com/largest/">https://aidatacenterindex.com/largest/</a></p></figcaption></figure>
