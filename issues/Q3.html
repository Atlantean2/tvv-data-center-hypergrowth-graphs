<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q3</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q3")</script></head><body><main id="issue"><h2 class="desk">Q3. Financing</h2><figure class="g"><img src="img/04_financing_mix.webp" alt="$131B of USD AI data-center debt, Jan 2025 – Oct 7 2026 (45 instruments)" loading="lazy"><figcaption><span class="t">$131B of USD AI data-center debt, Jan 2025 – Oct 7 2026 (45 instruments)</span><ul><li>Outside the hyperscalers, AI data-center borrowers have raised $131B of USD debt since Jan-2025 across 45 deals. Secured notes are the largest piece ($51B), followed by converts ($31B). CoreWeave alone raised $34B. <a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/">(source)</a></li><li>Neoclouds and bitcoin-miner conversions mostly use high-yield secured notes. Examples are TeraWulf ($3.2B at 7.75%, with Google backstopping about $1.8B), Cipher, Applied Digital and Galaxy (9.875%), plus the Meridian/Fluidstack $5.7B high-yield bond. <a href="https://debtexplorer.whitecase.com/leveraged-finance-commentary/high-yield-bond-markets-ride-the-data-center-boom">(source)</a></li><li>Securitization is also in use: QTS BX 2025-VOLT ($3.5B CMBS) and Switch ($3.5B CMBS plus ABS). <a href="https://computelaw.blog/deals/ai-data-center-securitization/">(source)</a></li><li>High-yield issuance is accelerating. US AI high-yield issuance in the first four months of 2026 ($26.6B) was more than double the 2025 total. <a href="https://debtexplorer.whitecase.com/leveraged-finance-commentary/high-yield-bond-markets-ride-the-data-center-boom">(source)</a></li></ul><p>Source: ai-industry-reviews.com AI data center debt financing statistics 2026 (SEC 8-K based); excludes hyperscaler corporate bonds.<br><a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/">https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/</a></p></figcaption></figure>
<figure class="g"><img src="img/05_debt_by_borrower.webp" alt="Who borrowed: hyperscaler bonds (blue) vs. neocloud/SPV/miner debt (red)" loading="lazy"><figcaption><span class="t">Who borrowed: hyperscaler bonds (blue) vs. neocloud/SPV/miner debt (red)</span><ul><li>Outside the hyperscalers, AI data-center borrowers have raised $131B of USD debt since Jan-2025 across 45 deals. Secured notes are the largest piece ($51B), followed by converts ($31B). CoreWeave alone raised $34B. <a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/">(source)</a></li><li>Hyperscalers have also issued about $250B of corporate bonds of their own: Amazon $77B, Alphabet $67B, Meta $55B and Oracle $50.75B. <a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/">(source)</a></li></ul><p>Source: ai-industry-reviews.com (SEC filings), Jan 2025–Oct 2026.<br><a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/">https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-N1.webp" alt="Hyperscaler bond binge: Amazon, Alphabet and Meta debt up ~$280B in a year" loading="lazy"><figcaption><span class="t">Hyperscaler bond binge: Amazon, Alphabet and Meta debt up ~$280B in a year</span><p>Long-term debt by quarter; Amazon, Alphabet, Meta added ~$281B, Sep 2025–Sep 2026. Source: SEC 10-Q XBRL.</p><ul><li>Sep 30 2026 vs Sep 30 2025:<ul><li>Amazon $180.9B vs $55.1B</li><li>Alphabet $125.1B (noncurrent) vs $21.6B</li><li>Meta $80.9B vs $28.8B</li></ul></li><li>Oracle had $125.3B of notes and loans at Aug 31 2026, down from a $134.6B peak in Feb 2026. CoreWeave had $35.6B of debt at Jun 30 2026, up from $8.0B at Dec 2024.</li><li>Microsoft is the outlier, paying debt down to $35.5B.</li></ul><p>Sources: <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001018724.json">SEC EDGAR XBRL company facts, Amazon</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001652044.json">SEC EDGAR XBRL company facts, Alphabet</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json">SEC EDGAR XBRL company facts, Meta</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001341439.json">SEC EDGAR XBRL company facts, Oracle</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0000789019.json">SEC EDGAR XBRL company facts, Microsoft</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001769628.json">SEC EDGAR XBRL company facts, CoreWeave</a> <a href="https://www.sec.gov/Archives/edgar/data/1018724/000101872426000040/amzn-20260930.htm">Amazon 10-Q, quarter ended Sep 30 2026 (SEC)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-N6.webp" alt="AI capex now exceeds operating cash at Amazon, Alphabet and Meta" loading="lazy"><figcaption><span class="t">AI capex now exceeds operating cash at Amazon, Alphabet and Meta</span><p>From the latest 10-Q filings: the big four&#x27;s combined quarterly free cash flow (operating cash flow minus capex) was -26.4B, against +61.7B a year earlier. Capex rose from 97B to 202B; operating cash flow rose only from 159B to 175B. Amazon -34.8B, Alphabet -9.1B and Meta -1.2B were negative; Microsoft stayed positive at +18.6B. Oracle (Jun-Aug 2026) was -5.4B and CoreWeave (Apr-Jun 2026) -5.7B. For the thesis: the gap now has to be filled by bonds, leases and SPVs. Against it: operating cash is still rising, and the big four hold large cash piles. Combined FCF has fallen three quarters running (60.2B, 21.0B, 6.7B, then -26.4B). This is the first negative quarter since at least 2023, but it is only one quarter.</p><ul><li>Capex 97B → 202B (Jul-Sep 2025 → 2026), big four</li><li>Operating cash flow 159B → 175B</li><li>Microsoft only big-four member still FCF-positive: +18.6B</li></ul><p class="nt">Note: C</p><p class="nt">Note: a</p><p class="nt">Note: p</p><p class="nt">Note: e</p><p class="nt">Note: x</p><p class="nt">Note:  </p><p class="nt">Note: =</p><p class="nt">Note:  </p><p class="nt">Note: p</p><p class="nt">Note: u</p><p class="nt">Note: r</p><p class="nt">Note: c</p><p class="nt">Note: h</p><p class="nt">Note: a</p><p class="nt">Note: s</p><p class="nt">Note: e</p><p class="nt">Note: s</p><p class="nt">Note:  </p><p class="nt">Note: o</p><p class="nt">Note: f</p><p class="nt">Note:  </p><p class="nt">Note: p</p><p class="nt">Note: r</p><p class="nt">Note: o</p><p class="nt">Note: p</p><p class="nt">Note: e</p><p class="nt">Note: r</p><p class="nt">Note: t</p><p class="nt">Note: y</p><p class="nt">Note:  </p><p class="nt">Note: a</p><p class="nt">Note: n</p><p class="nt">Note: d</p><p class="nt">Note:  </p><p cla te: Q</p><p class="nt">Note: u</p><p class="nt">Note: a</p><p class="nt">Note: r</p><p class="nt">Note: t</p><p class="nt">Note: e</p><p class="nt">Note: r</p><p class="nt">Note: l</p><p class="nt">Note: y</p><p class="nt">Note:  </p><p class="nt">Note: v</p><p class="nt">Note: a</p><p class="nt">Note: l</p><p class="nt">Note: u</p><p class="nt">Note: e</p><p class="nt">Note: s</p><p class="nt">Note:  </p><p class="nt">Note: f</p><p class="nt">Note: o</p><p class="nt">Note: r</p><p class="nt">Note:  </p><p class="nt">Note: Q</p><p class="nt">Note: 2</p><p class="nt">Note: -</p><p class="nt">Note: Q</p><p class="nt">Note: 4</p><p class="nt">Note:  </p><p class="nt">Note: a</p><p class="nt">Note: r</p><p class="nt">Note: e</p><p class="nt">Note:  </p><p class="nt">Note: d</p><p class="nt">Note: e</p><p class="nt">Note: r</p><p class="nt">Note: i</p><p class="nt">Note: v</p><p class="nt">Note: e</p><p class="nt">Note: d</p><p class="nt">Note:  </p><p class="nt">Note: b</p><p class="nt">Note: y</p><p class="nt">Note:  </p><p class="nt">Note: s</p><p class="nt">Note: u</p><p class="nt">Note: b</p><p class="nt">Note: t</p><p class="nt">Note: r</p><p class="nt">Note: a</p><p class="nt">Note: c</p><p class="nt">Note: t</p><p class="nt">Note: i</p><p class="nt">Note: n</p><p class="nt">Note: g</p><p class="nt">Note:  </p><p class="nt">Note: y</p><p class="nt">Note: e</p><p class="nt">Note: a</p><p class="nt">Note: r</p><p class="nt">Note: -</p><p class="nt">Note: t</p><p class="nt">Note: o</p><p class="nt">Note: -</p><p class="nt">Note: d</p><p class="nt">Note: a</p><p class="nt">Note: t</p><p class="nt">Note: e</p><p class="nt">Note:  </p><p class="nt">Note: f</p><p class="nt">Note: i</p><p class="nt">Note: l</p><p class="nt">Note: i</p><p class="nt">Note: n</p><p class="nt">Note: g</p><p class="nt">Note: s</p><p class="nt">Note: .</p><p>Sources: <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001018724.json">SEC EDGAR XBRL: Amazon 10-Q</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0000789019.json">Microsoft</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001652044.json">Alphabet</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json">Meta</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001341439.json">Oracle</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001769628.json">CoreWeave</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-08-N9.webp" alt="Off-balance-sheet lease promises now top $1.3 trillion" loading="lazy"><figcaption><span class="t">Off-balance-sheet lease promises now top $1.3 trillion</span><p>The latest 10-Qs put uncommenced or additional lease commitments at $1,339.3 billion across Microsoft ($364.6B as of Sep 30), Meta ($355.73B), Oracle ($288B as of Aug 31), Amazon ($164.922B), Alphabet ($130.5B) and CoreWeave ($35.5B as of Jun 30; its Q3 report is not due until after the Nov 10 close). Microsoft, Meta and Oracle each describe those commitments as primarily or substantially data-center related. On-balance-sheet operating lease liabilities from the same filings are far smaller: Microsoft $27.477B, Meta $31.173B, Oracle $34.621B, Amazon $100.288B, Alphabet $20.508B, CoreWeave $16.319B. For the thesis: more than a trillion dollars of future data-center lease payments sit off the balance sheet and only work if the tenants’ cash flows stay healthy enough to pay for 15–20 years. Against it: the off-balance-sheet figures are undiscounted payment streams, not present-value debt, so they are not strictly comparable to the XBRL liabilities; some Microsoft arrangements are subject to contractual conditions; Amazon’s lease book includes fulfillment centers as well as data centers; and Tesla’s latest 10-Q does not disclose a comparable uncommenced data-center lease book (it reports a $2.00B SpaceX equity stake, formerly an xAI preferred investment, and capex ‘in excess of $20 billion’ in 2026 including compute infrastructure).</p><ul><li>Uncommenced / additional leases: Microsoft $364.6B, Meta $355.73B, Oracle $288B, Amazon $164.9B, Alphabet $130.5B, CoreWeave $35.5B (total $1,339.3B).</li><li>On-balance-sheet operating lease liabilities (PV): Amazon $100.3B is the largest; Microsoft $27.5B, Oracle $34.6B, Meta $31.2B.</li><li>Microsoft also reports $70.973B of finance-lease liabilities on the balance sheet as of Sep 30, 2026.</li><li>Tesla: no matching uncommenced DC lease total in the Sep 30 10-Q; $2.00B SpaceX stake (formerly xAI preferred) and capex ‘in excess of $20 billion’ in 2026.</li></ul><p class="nt">Note: FOR: Microsoft’s 10-Q says the $364.6B is ‘primarily for datacenters’; Oracle’s $288B is ‘substantially all related to data center arrangements’ expected to commence FY27–FY29 for terms of 15–19 years; Meta’s $355.73B is data centers, energy, colocations and network infrastructure commencing through 2036. Those payment streams are exactly what SPV bonds and private-credit leases pre-fund. AGAINST: undiscounted 15–26 year payment totals are not the same as debt; Microsoft notes some leases are subject to conditions being met; Amazon’s table is not DC-only; CoreWeave’s figure is a quarter older than the others. This chart does not reuse the Nov 8 daily Oracle-vs-CoreWeave operating-lease, PP&amp;E, debt-to-cash or refinancing-shock graphics.</p><p>Sources: <a href="https://www.sec.gov/Archives/edgar/data/789019/000119312526436133/msft-20260930.htm">Microsoft 10-Q filed Oct 28, 2026 (period Sep 30)</a> <a href="https://www.sec.gov/Archives/edgar/data/1326801/000162828026066773/meta-20260930.htm">Meta 10-Q filed Oct 22, 2026 (period Sep 30)</a> <a href="https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm">Oracle 10-Q filed Sep 11, 2026 (period Aug 31)</a> <a href="https://www.sec.gov/Archives/edgar/data/1018724/000101872426000040/amzn-20260930.htm">Amazon 10-Q filed Oct 30, 2026 (period Sep 30)</a> <a href="https://www.sec.gov/Archives/edgar/data/1652044/000165204426000084/goog-20260930.htm">Alphabet 10-Q filed Oct 29, 2026 (period Sep 30)</a> <a href="https://www.sec.gov/Archives/edgar/data/1769628/000176962826000366/crwv-20260630.htm">CoreWeave 10-Q filed Aug 12, 2026 (period Jun 30)</a> <a href="https://www.sec.gov/Archives/edgar/data/1318605/000162828026066775/tsla-20260930.htm">Tesla 10-Q filed Oct 22, 2026 (no comparable uncommenced DC lease figure)</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0000789019.json">SEC companyfacts: OperatingLeaseLiability tags</a></p></figcaption></figure></main></body></html>
