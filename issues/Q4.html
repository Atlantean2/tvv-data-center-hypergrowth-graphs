<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. Off-Balance-Sheet Exposure</h2><figure class="g"><img src="img/06_uncommenced_leases.webp" alt="Off-balance-sheet lease commitments: ~$1.2T and rising" loading="lazy"><figcaption><span class="t">Off-balance-sheet lease commitments: ~$1.2T and rising</span><ul><li>About $1.2T of data-center leases have been signed but have not yet commenced, so they are off the balance sheet. The amounts are Meta $355.7B (Sep-26), Microsoft $329.1B (Jun-26), Oracle $288B (Aug-26), Amazon $137.2B (Jun-26) and Alphabet $85.2B (Jun-26). Total signed-but-undelivered commitments are about $2.8T. <a href="https://ccir.io/credit/commitments">(source)</a></li><li>Growth is steep. Meta&#x27;s figure rose from $58B to $356B in a year, about 6x. Oracle&#x27;s went from $43B (May-25) to $288B, Microsoft&#x27;s from $93B to $329B, and Alphabet&#x27;s from $24B to $85B. <a href="https://ahasignals.com/research/uncommenced-lease-commitments/">(source)</a></li><li>WSJ: Big Tech&#x27;s AI spending is &#x27;$3 trillion higher than it seems&#x27; once off-balance-sheet obligations are counted. <a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">(source)</a></li><li>The obligations are off the balance sheet and growing far faster than revenue: about $1.2T of uncommenced leases plus Meta&#x27;s $41.5B maximum RVG and Alphabet&#x27;s $43.8B of backstops. <a href="https://ccir.io/credit/commitments">(source)</a></li><li>Disclosure under ASC 842 is fairly transparent. The leases appear in footnotes, and investors such as WSJ, Reuters and ratings agencies are pricing them. <a href="https://www.reuters.com/business/retail-consumer/ai-data-centre-race-builds-1-trillion-lease-burden-big-tech-2026-08-04/">(source)</a></li></ul><p>Source: Company 10-K/10-Q (ASC 842) via ahasignals.com, ccir.io; Oracle 10-Q Aug-26; WSJ Aug 2026 analysis.<br><a href="https://ahasignals.com/research/uncommenced-lease-commitments/">https://ahasignals.com/research/uncommenced-lease-commitments/</a> <a href="https://ccir.io/credit/commitments">https://ccir.io/credit/commitments</a> <a href="https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm">https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm</a> <a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2</a></p></figcaption></figure></main></body></html>
