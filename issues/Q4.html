<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. Off-Balance-Sheet Exposure</h2><figure class="g"><img src="img/06_uncommenced_leases.webp" alt="Off-balance-sheet lease commitments: ~$1.2T and rising" loading="lazy"><figcaption><span class="t">Off-balance-sheet lease commitments: ~$1.2T and rising</span><ul><li>About $1.2T of data-center leases have been signed but have not yet commenced, so they are off the balance sheet. The amounts are Meta $355.7B (Sep-26), Microsoft $329.1B (Jun-26), Oracle $288B (Aug-26), Amazon $137.2B (Jun-26) and Alphabet $85.2B (Jun-26). Total signed-but-undelivered commitments are about $2.8T. <a href="https://ccir.io/credit/commitments">(source)</a></li><li>Growth is steep. Meta&#x27;s figure rose from $58B to $356B in a year, about 6x. Oracle&#x27;s went from $43B (May-25) to $288B, Microsoft&#x27;s from $93B to $329B, and Alphabet&#x27;s from $24B to $85B. <a href="https://ahasignals.com/research/uncommenced-lease-commitments/">(source)</a></li><li>WSJ: Big Tech&#x27;s AI spending is &#x27;$3 trillion higher than it seems&#x27; once off-balance-sheet obligations are counted. <a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">(source)</a></li><li>The obligations are off the balance sheet and growing far faster than revenue: about $1.2T of uncommenced leases plus Meta&#x27;s $41.5B maximum RVG and Alphabet&#x27;s $43.8B of backstops. <a href="https://ccir.io/credit/commitments">(source)</a></li><li>Disclosure under ASC 842 is fairly transparent. The leases appear in footnotes, and investors such as WSJ, Reuters and ratings agencies are pricing them. <a href="https://www.reuters.com/business/retail-consumer/ai-data-centre-race-builds-1-trillion-lease-burden-big-tech-2026-08-04/">(source)</a></li></ul><p>Source: Company 10-K/10-Q (ASC 842) via ahasignals.com, ccir.io; Oracle 10-Q Aug-26; WSJ Aug 2026 analysis.<br><a href="https://ahasignals.com/research/uncommenced-lease-commitments/">https://ahasignals.com/research/uncommenced-lease-commitments/</a> <a href="https://ccir.io/credit/commitments">https://ccir.io/credit/commitments</a> <a href="https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm">https://www.sec.gov/Archives/edgar/data/1341439/000119312526389274/orcl-20260831.htm</a> <a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-N2.webp" alt="Meta&#x27;s non-cancelable commitments jumped from $28B to $455B in five quarters" loading="lazy"><figcaption><span class="t">Meta&#x27;s non-cancelable commitments jumped from $28B to $455B in five quarters</span><p>Meta&#x27;s off-balance-sheet purchase commitments reached $454.5B at Sep 30 2026, separate from $355.7B of uncommenced leases. Source: Meta 10-Q.</p><ul><li>Commitments were $27.95B at Jun 30 2025 and $454.52B at Sep 30 2026, mostly third-party cloud capacity, servers, network gear and energy agreements.</li><li>Of that, $45.85B is due in the rest of 2026 and $121.41B in 2027. There are also up to $14.72B of contingent cloud purchases.</li><li>Separately, Meta has $355.7B of leases signed but not commenced (2026–2036), also off the balance sheet.</li><li>Amazon comparison, Sep 30 2026: total commitments $883.6B. About $438B of that is not on the balance sheet (leases not commenced $164.9B, property and equipment $159.6B, purchase obligations $94.8B, other $19.0B).</li></ul><p class="nt">Note: Not a duplicate of the lease chart above: that chart plots leases signed but not yet commenced (Meta $355.7B); this one plots Meta&#x27;s separate non-cancelable purchase commitments ($454.52B at Sep 30 2026, SEC XBRL ContractualObligation). The two should not be added together without checking for overlap.</p><p>Sources: <a href="https://www.sec.gov/Archives/edgar/data/1326801/000162828026066773/meta-20260930.htm">Meta 10-Q, quarter ended Sep 30 2026 (SEC)</a> <a href="https://data.sec.gov/api/xbrl/companyfacts/CIK0001326801.json">SEC EDGAR XBRL company facts, Meta</a> <a href="https://www.sec.gov/Archives/edgar/data/1018724/000101872426000040/amzn-20260930.htm">Amazon 10-Q, quarter ended Sep 30 2026 (SEC)</a></p></figcaption></figure></main></body></html>
