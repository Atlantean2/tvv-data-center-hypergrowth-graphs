<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q1</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q1")</script></head><body><main id="issue"><h2 class="desk">Q1. Capacity Growth</h2><figure class="g"><img src="img/01_iea_dc_electricity.webp" alt="Data-center electricity demand roughly doubles by 2030" loading="lazy"><figcaption><span class="t">Data-center electricity demand roughly doubles by 2030</span><ul><li>Physical build-out: the frontier AI sites Epoch tracks reach about 15 GW of US power today and about 43 GW planned by 2030. The rest of the world goes from about 2.6 GW to 6.5 GW. The IEA projects global data-center electricity rising from 415 TWh to about 945 TWh by 2030. <a href="https://epoch.ai/data/data-centers">(source)</a></li></ul><p>Source: IEA, Energy and AI (2025). US/China 2024 derived from IEA shares (45%/25%) + stated increments.<br><a href="https://www.iea.org/reports/energy-and-ai/executive-summary">https://www.iea.org/reports/energy-and-ai/executive-summary</a></p></figcaption></figure>
<figure class="g"><img src="img/02_epoch_capacity_growth.webp" alt="Frontier AI data centers tracked by Epoch: power built &amp; planned" loading="lazy"><figcaption><span class="t">Frontier AI data centers tracked by Epoch: power built &amp; planned</span><ul><li>Physical build-out: the frontier AI sites Epoch tracks reach about 15 GW of US power today and about 43 GW planned by 2030. The rest of the world goes from about 2.6 GW to 6.5 GW. The IEA projects global data-center electricity rising from 415 TWh to about 945 TWh by 2030. <a href="https://epoch.ai/data/data-centers">(source)</a></li></ul><p>Source: Epoch AI, Frontier Data Centers Hub (timelines, satellite/permit-based; post-today = planned).<br><a href="https://epoch.ai/data/data-centers">https://epoch.ai/data/data-centers</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-21-M67.webp" alt="Chips still trail oil and gas in UN trade data through 2025" loading="lazy"><figcaption><span class="t">Chips still trail oil and gas in UN trade data through 2025</span><p>2025 world imports: chips $1.20T, crude plus gas $1.61T, all oil and gas $2.32T. UN Comtrade, Nov 19.</p><ul><li>Data. Data date: Annual 2010–2025 (2025 reporting incomplete), read Nov 19, 2026.</li><li>Nov 16, 2026 (claim): a Deutsche Bank report by FX strategist Mallika Sachdeva, using ITC Trade Map, says semiconductor exports passed oil and gas for the first time over the four quarters to Q2 2026. Rand’s chart shows $1.60T against $1.52T.</li><li>2025 (Data): UN Comtrade world imports of integrated circuits (HS 8542) were $1.20T, against $1.61T for crude oil and natural gas (HS 2709 + 2711) and $2.32T including refined products (HS 2710).</li><li>2010–2025 (Data): Rand’s chips line matches Comtrade closely ($0.62T in 2014, $1.26T in 2022). Its oil and gas line does not: Comtrade shows $2.51T for crude plus gas in 2022 and $3.57T with products, against about $2.1T on Rand’s chart.</li><li>2020 (Data): chips came closest before now, $0.94T against $0.96T for crude plus gas, when oil prices collapsed.</li><li>Jul 2025–Jun 2026 (Data): Brent averaged $76.5 a barrel, up from $68.1 in calendar 2025 (ICE futures via Yahoo). Higher prices make a fall in oil and gas trade to $1.52T less likely, unless the definition is narrow.</li><li>Omitted: the quarterly Q2 2026 crossover itself. ITC Trade Map quarterly data needs a login and Deutsche Bank does not publish its product definition, so the $1.60T and $1.52T figures are not verified.</li><li>Doubt: Chips are catching up fast, but the “first time ever” crossover depends on how oil and gas is defined. On UN data, chips were 52% of oil, products and gas trade in 2025 and 75% of crude and gas alone. The Q2 2026 figures cannot be checked without Trade Map’s subscription data.</li></ul><p>Sources: <a href="https://comtradeplus.un.org/">comtradeplus.un.org</a> <a href="https://comtradeapi.un.org/public/v1/preview/C/A/HS?period=2025&amp;cmdCode=8542&amp;flowCode=M&amp;partnerCode=0">comtradeapi.un.org: public/v1/preview/C/A/HS</a> <a href="https://www.marketdash.com/stock-market-news/78038/goodbye-petrodollar-meet-the-chip-dollar-the-1-trillion-flow-now-holding-up-the-greenback">marketdash.com: stock-market-news/78038/goodbye-petrodol</a> <a href="https://www.fxbrokertrust.com/insights/deutsche-bank-semiconductor-trade-overtakes-oil-as-chip-dollars-replace-petrodollars">fxbrokertrust.com: insights/deutsche-bank-semiconductor-tra</a> <a href="https://finance.yahoo.com/quote/BZ%3DF/history/">finance.yahoo.com: quote/BZ%3DF/history</a> <a href="https://x.com/randgroup/status/2123349064834036021">Original post (X)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-21-M71.webp" alt="EU made 1 notable AI model in 2025, the US 59, China 35" loading="lazy"><figcaption><span class="t">EU made 1 notable AI model in 2025, the US 59, China 35</span><p>2025 notable AI models: US 59, China 35, EU 1 (Stanford AI Index 2026, Epoch AI). Read Nov 21, 2026.</p><ul><li>Data. Data date: Annual 2023 to Nov 10, 2026; Epoch AI read Nov 21, 2026.</li><li>Apr 2026 (Data): the Stanford AI Index 2026 counts 2025 notable AI models by country: US 59, China 35, South Korea 8, and one each for France, the UK, Canada, Hong Kong and Singapore. Arouet’s 59, 35 and 1 match. Europe as a whole had 2; the EU had 1, Mistral.</li><li>Nov 21, 2026 (Data): Epoch AI’s current notable-models file, which the AI Index uses, now shows 2025 at US 66, China 36, EU27 1 after later additions. For 2026 to Nov 10 it shows US 60, China 34, EU27 2 (Mistral Large 4 and Medium 3.5).</li><li>2023–2025 (Data): the EU27 count fell from 12 to 5 to 1, while the US went 86, 58, 66 and China 23, 31, 36.</li><li>2025 (Data): on Epoch’s broader list of models trained with more than 10²³ FLOP, the counts are US 66, China 82, EU27 6 (Teuken, three Mistral models, INSAIT’s MamayLM, AGH’s Lapa). The EU gap holds on every definition.</li><li>Aug 2, 2025 (Data): the EU AI Act’s rules for general-purpose models took effect. The EU decline from 12 to 5 began in 2024, before that date.</li><li>Speculation: blaming regulation, energy prices or talent flight is opinion. The counts alone do not show the cause.</li><li>Doubt: The count is real but small and curated. “Notable” is Epoch’s editorial list, not a census, and models are credited by author affiliation, so joint work can count twice. On the broader compute-based list the EU had 6 models in 2025, still far behind.</li></ul><p>Sources: <a href="https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_1_research_development.pdf">hai.stanford.edu: assets/files/ai_index_report_2026_chapte</a> <a href="https://epoch.ai/data/notable-ai-models">epoch.ai: data/notable-ai-models</a> <a href="https://epoch.ai/data/notable_ai_models.csv">epoch.ai: data/notable_ai_models.csv</a> <a href="https://epoch.ai/data/large_scale_ai_models.csv">epoch.ai: data/large_scale_ai_models.csv</a> <a href="https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai">digital-strategy.ec.europa.eu: en/policies/regulatory-framework-ai</a> <a href="https://x.com/i/status/2123748954747662467">Original post (X)</a></p></figcaption></figure></main></body></html>
