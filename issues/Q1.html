<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q1</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q1")</script></head><body><main id="issue"><h2 class="desk">Q1. Capacity Growth</h2><figure class="g"><img src="img/01_iea_dc_electricity.webp" alt="Data-center electricity demand roughly doubles by 2030" loading="lazy"><figcaption><span class="t">Data-center electricity demand roughly doubles by 2030</span><ul><li>Physical build-out: the frontier AI sites Epoch tracks reach about 15 GW of US power today and about 43 GW planned by 2030. The rest of the world goes from about 2.6 GW to 6.5 GW. The IEA projects global data-center electricity rising from 415 TWh to about 945 TWh by 2030. <a href="https://epoch.ai/data/data-centers">(source)</a></li></ul><p>Source: IEA, Energy and AI (2025). US/China 2024 derived from IEA shares (45%/25%) + stated increments.<br><a href="https://www.iea.org/reports/energy-and-ai/executive-summary">https://www.iea.org/reports/energy-and-ai/executive-summary</a></p></figcaption></figure>
