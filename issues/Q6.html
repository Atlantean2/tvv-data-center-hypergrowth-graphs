<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q6</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q6")</script></head><body><main id="issue"><h2 class="desk">Q6. Video Claims Checked</h2><figure class="g"><img src="img/09_wsj_obs_vs_capex_approx.webp" alt="Off-balance-sheet obligations grew far faster than capex (APPROXIMATE, rebuilt from WSJ chart)" loading="lazy"><figcaption><span class="t">Off-balance-sheet obligations grew far faster than capex (APPROXIMATE, rebuilt from WSJ chart)</span><ul><li>CONFIRMED: the WSJ found about $3T of off-balance-sheet commitments across nine top tech companies, mostly AI-related. The WSJ article is by Rudegeair &amp; Santilli, Aug 17 2026. An independent 10-Q tally by edgarstat counts $1.21T of uncommenced leases plus $1.90T of purchase commitments, $3.25T in total, about 3.6x on-balance-sheet debt and leases. (source) (source) <a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">(source)</a> <a href="https://edgarstat.com/blog/the-three-trillion-dollar-footnote-big-techs-ai-commitments/">(source)</a></li><li>PARTLY CONFIRMED: the WSJ &#x27;percentage change from a year earlier&#x27; chart shown at 15:03, as read approximately from the frame: Alphabet ~830%, Meta ~765%, Oracle ~540%, Nvidia ~265%, Microsoft ~135%, Amazon ~85%, against capex growth of roughly 60–160%. The chart&#x27;s note says the data is as of June (Nvidia April, Meta July). The WSJ article itself is paywalled, so the exact values are unverified. (source) <a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">(source)</a></li><li>PARTLY CONFIRMED: Moody&#x27;s (Gonzales &amp; Drake, Feb 2026) wrote that hyperscalers&#x27; AI lease commitments &#x27;may understate economic risk&#x27;. It counted $662B of uncommenced leases, equal to 113% of adjusted debt, and warned of possible debt adjustments. Moody&#x27;s frames this as reporting deferral under GAAP, not as &#x27;aggressive&#x27; accounting; that word comes from the WSJ&#x27;s Jonathan Weil. (source) (source) <a href="https://fortune.com/2026/02/25/hyperscaler-risk-off-balance-sheet-662-billion-data-center-commitments-meta-amazon-microsoft-oracle-alphabet/">(source)</a> <a href="https://www.datacenterdynamics.com/en/news/moodys-hyperscalers-understating-risks-of-short-term-ai-dc-lease-agreements-leaving-investors-in-the-dark/">(source)</a></li><li>UNCONFIRMED / OPINION: &#x27;reporting zero liabilities&#x27; and &#x27;not being rated accurately&#x27;. The lease commitments and RVGs are disclosed in footnotes; they are off the balance sheet but not hidden. Ratings are disputed: S&amp;P rates Beignet A+, while Moody&#x27;s signals possible debt adjustments. (source) <a href="https://ccir.io/credit/commitments">(source)</a></li></ul><p>Source: Rebuilt approximately from WSJ chart (WSJ analysis of company filings), Aug 17 2026.<br><a href="https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2">https://www.wsj.com/tech/ai/why-big-techs-ai-spending-is-3-trillion-higher-than-it-seems-e1067bb2</a></p></figcaption></figure>
<figure class="g"><img src="img/08_hyperion_cost_timeline.webp" alt="Meta Hyperion (Richland Parish, LA): stated cost 5x in 19 months — partly scope (2 GW → 5 GW)" loading="lazy"><figcaption><span class="t">Meta Hyperion (Richland Parish, LA): stated cost 5x in 19 months — partly scope (2 GW → 5 GW)</span><ul><li>CONFIRMED (figures): Hyperion was announced at $10B on Dec 4 2024. The Blue Owl JV in Oct 2025 put total development costs at about $27B and was financed with $27.3B of Beignet notes. On Jul 13 2026 Meta committed more than $50B. (source) (source) (source) <a href="https://gov.louisiana.gov/news/4697">(source)</a> <a href="https://investor.atmeta.com/investor-news/press-release-details/2025/Meta-Announces-Joint-Venture-with-Funds-Managed-by-Blue-Owl-Capital-to-Develop-Hyperion-Data-Center/default.aspx">(source)</a> <a href="https://www.cnbc.com/2026/07/13/meta-louisiana-data-center-investment-reaches-50-billion-amid-ai-push.html">(source)</a></li><li>PARTLY CONFIRMED (interpretation): the video calls this &#x27;scope creep&#x27; that more than doubled costs and says the news was &#x27;buried&#x27;. In fact the scope itself grew: from 2,250 acres and 4M sq ft to 3,200+ acres, about 10M sq ft and 5 GW. That makes it a mix of expansion and higher cost per GW, not a like-for-like overrun. The July news was announced at a press event with the Louisiana governor and reported by the WSJ and CNBC, so it was not buried. The fair point stands: no financing partner has been named for the extra ~$23B. (source) (source) <a href="https://www.opportunitylouisiana.gov/news/meta-commits-more-than-50-billion-for-north-louisiana-project-becoming-one-of-the-largest-data-centers-in-history">(source)</a> <a href="https://www.wsj.com/tech/meta-lifts-cost-of-louisiana-data-center-to-50-billion-02b2eb25">(source)</a></li><li>CONFIRMED: Meta&#x27;s auditor, EY, made the Hyperion JV a critical audit matter in the FY2025 10-K. The issue was Meta&#x27;s judgment that it is not the primary beneficiary of the joint venture, which keeps the JV unconsolidated. The 10-K also shows a $12.31B lease commitment, a ~$28B declining RVG threshold and $45.95B of maximum exposure. A critical audit matter flags hard judgment, not an error. (source) (source) <a href="https://www.sec.gov/Archives/edgar/data/1326801/000162828026003942/meta-20251231.htm">(source)</a> <a href="https://deepquarry.substack.com/p/beyond-the-hype-auditor-ey-highlights">(source)</a></li></ul><p>Source: La. Governor release Dec 4 2024; Meta IR Oct 21 2025; Louisiana Economic Development &amp; CNBC Jul 13 2026.<br><a href="https://gov.louisiana.gov/news/4697">https://gov.louisiana.gov/news/4697</a> <a href="https://investor.atmeta.com/investor-news/press-release-details/2025/Meta-Announces-Joint-Venture-with-Funds-Managed-by-Blue-Owl-Capital-to-Develop-Hyperion-Data-Center/default.aspx">https://investor.atmeta.com/investor-news/press-release-details/2025/Meta-Announces-Joint-Venture-with-Funds-Managed-by-Blue-Owl-Capital-to-Develop-Hyperion-Data-Center/default.aspx</a> <a href="https://www.opportunitylouisiana.gov/news/meta-commits-more-than-50-billion-for-north-louisiana-project-becoming-one-of-the-largest-data-centers-in-history">https://www.opportunitylouisiana.gov/news/meta-commits-more-than-50-billion-for-north-louisiana-project-becoming-one-of-the-largest-data-centers-in-history</a></p></figcaption></figure></main></body></html>
