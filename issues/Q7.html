<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q7</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. Power &amp; Grid</h2><figure class="g w"><img src="img/W2026-10-30-N4.webp" alt="PJM grid capacity bill: $2.2B to $16.4B a year; data centers drove $6.3B of the latest" loading="lazy"><figcaption><span class="t">PJM grid capacity bill: $2.2B to $16.4B a year; data centers drove $6.3B of the latest</span><p>PJM 2028/29 capacity cost $16.4B at the $325/MW-day cap; IMM: $6.3B from data centers. Sources: PJM, IMM.</p><ul><li>Jul 14 2026: the 2028/29 auction cleared at the $325/MW-day cap, $16.4B in total, 6,831 MW short of the reliability requirement.</li><li>The simulated no-cap price was $554.72/MW-day, which would have meant $29.7B.</li><li>Jul 28 2026, IMM: data-center load accounts for $6.3B (38.2%) of the 2028/29 cost and $29.4B (46.2%) over the last four auctions.</li><li>The data-center load forecast rose from 7.9 GW (2025/26) to 21.5 GW (2028/29).</li></ul><p>Sources: <a href="https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/2028-2029/2028-2029-bra-results-report.pdf">PJM 2028/2029 Base Residual Auction report (PDF)</a> <a href="https://www.pjm.com/-/media/DotCom/about-pjm/newsroom/2026-releases/20260714-pjm-capacity-auction-procures-138318-mw-of-generation-resources.pdf">PJM news release, Jul 14 2026 (PDF)</a> <a href="https://www.monitoringanalytics.com/reports/presentations/2026/IMM_MC_Market_Monitor_Report_20260728.pdf">Monitoring Analytics (PJM IMM) report, Jul 28 2026 (PDF)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-N5.webp" alt="US data centers could use 6.7–12% of all US electricity by 2028, up from 4.4%" loading="lazy"><figcaption><span class="t">US data centers could use 6.7–12% of all US electricity by 2028, up from 4.4%</span><p>US data-center use was 176 TWh (4.4%) in 2023; the 2028 scenarios are 325–580 TWh (6.7–12%). Source: LBNL/DOE, Dec 2024.</p><ul><li>US data-center use was 58 TWh in 2014, 76 TWh (1.9%) in 2018 and 176 TWh (4.4%) in 2023.</li><li>The 2028 scenarios are 325–580 TWh, equal to 6.7–12.0% of US electricity and 74–132 GW.</li><li>Published Dec 20 2024 by LBNL for DOE. This is the most recent official US-wide estimate.</li></ul><p>Sources: <a href="https://eta-publications.lbl.gov/sites/default/files/2024-12/lbnl-2024-united-states-data-center-energy-usage-report_1.pdf">LBNL 2024 US Data Center Energy Usage Report (PDF)</a> <a href="https://www.energy.gov/articles/doe-releases-new-report-evaluating-increase-electricity-demand-data-centers">US DOE release on the LBNL report</a></p></figcaption></figure></main></body></html>
