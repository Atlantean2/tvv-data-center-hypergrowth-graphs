<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q11</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q11")</script></head><body><main id="issue"><h2 class="desk">Q11. Junk Thesis</h2><figure class="g w"><img src="img/W2026-11-15-N11.webp" alt="Junk in disguise? Off-balance-sheet data-center bonds price like high yield, not A+" loading="lazy"><figcaption><span class="t">Junk in disguise? Off-balance-sheet data-center bonds price like high yield, not A+</span><p>Thesis test: coupons at issue on 14 data-center-linked financings, May 2025 – November 2026, against the ICE BofA US High Yield index effective yield (black) and Moody&#x27;s Baa yield (green dashed). Evidence FOR the thesis: Meta&#x27;s Hyperion SPV bond (Beignet), rated A+ by S&amp;P and kept off Meta&#x27;s balance sheet, priced at 6.581% on Oct 16 2025, when the whole junk-bond index yielded 6.58% and Baa bonds 5.74%; by Oct 30 2026 it traded at 92.31 to yield 7.55%, closer to the high-yield index (7.99% on Oct 29) than to single-A bonds (5.63%). Six of the nine SPV/project bonds (red) were priced at or above the junk index on their issue dates, and all nine above the Baa yield, and the Fed&#x27;s November Financial Stability Report says the subordinated tranches of such vehicles are held by high-yield funds, life insurers and BDCs. Evidence AGAINST: Microsoft and Meta still borrow on their own balance sheets well inside high yield, several 2026 SPV deals (Cipher 6.0–6.125%, Applied Digital 6.75–7.0%) priced below the junk index, and Beignet&#x27;s lease is backed by Meta&#x27;s residual-value guarantee.</p><ul><li>Fed FSR (Nov 13 2026): advanced-computing debt issuance topped $680 billion by October 2026 (vs $130 billion in 2023), about 31% of nonfinancial investment-grade issuance; public AI-computing debt outstanding exceeds $1.1 trillion; not-yet-commenced leases exceed $1 trillion undiscounted and guarantees plus take-or-pay commitments exceed $2 trillion.</li><li>This week&#x27;s signal: Blackstone&#x27;s QTS cut a data-center private placement from $800M to $300M rather than pay up; the $100M 7-year piece priced at Treasuries +245 bp, still inside the high-yield index spread, so it is evidence both ways.</li><li>On X, the Kobeissi Letter tallied $4.49 trillion of disclosed off-balance-sheet obligations at Alphabet, Meta, Anthropic, Microsoft, Amazon, Oracle and Nvidia, nearly 6x their on-balance-sheet debt and leases; unusual_whales flagged Nvidia&#x27;s $36 billion of off-balance-sheet backstops for neoclouds.</li><li>Verdict so far: the market is pricing much SPV debt as if it were junk-adjacent, regardless of ratings. That supports Michael&#x27;s thesis on pricing; whether it is junk on credit quality depends on whether the hyperscaler lease guarantees hold.</li><li>Deal-by-deal (issue date; coupon; HY index yield that day; Baa monthly): xAI secured notes (2025-06-15; 12.5%; HY 7.22%; Baa 6.15%); Meta Hyperion SPV (Beignet), A+ (2025-10-16; 6.581%; HY 6.58%; Baa 5.74%); Lake Mariner (Fluidstack, Google backstop) (2025-10-15; 7.75%; HY 6.57%; Baa 5.74%); Barber Lake (Cipher/Fluidstack) (2025-11-15; 7.125%; HY 6.81%; Baa 5.86%); Applied Digital Ellendale (CoreWeave) (2025-11-14; 9.25%; HY 6.81%; Baa 5.86%); Cipher Black Pearl (2026-02-15; 6.125%; HY 6.56%; Baa 5.81%); Applied Digital ComputeCo 2 (2026-03-15; 6.75%; HY 7.17%; Baa 6.04%); Stargate Michigan (Oracle/OpenAI) (2026-04-15; 7.5%; HY 6.74%; Baa 6.03%); Applied Digital ComputeCo 3 (2026-06-14; 7%; HY 6.91%; Baa 6.00%); Cipher Stingray (2026-06-16; 6%; HY 6.86%; Baa 6.00%); CoreWeave Helios notes (2026-07-15; 9.875%; HY 6.96%; Baa 6.19%); Microsoft (range 4.85–6.35%) (2026-10-29; 4.85–6.35%; HY 7.99%; Baa 6.59%); Oracle (range 7.00–8.65%) (2026-11-02; 7.00–8.65%; HY 8.12%; Baa 6.59%); Meta (range 5.85–7.50%) (2026-11-03; 5.85–7.50%; HY 8.14%; Baa 6.59%).</li></ul><p class="nt">Note: Coupons at issue approximate yields at issue for bonds sold near par. Square markers have known months but approximate days (placed mid-month). Corporate deals show the full coupon range across maturities (2028–2066), so long bonds naturally yield more; the three corporate bars are nudged a few days apart for legibility. The ICE single-A, BBB and BB yields on Oct 29 2026 (5.63%, 6.01%, 6.69%) come from FRED as recorded in last week&#x27;s TVV data-center spreadsheet; FRED was not reachable for a refresh on Nov 15.</p><p>Sources: <a href="https://investor.atmeta.com/investor-news/press-release-details/2025/Meta-Announces-Joint-Venture-with-Funds-Managed-by-Blue-Owl-Capital-to-Develop-Hyperion-Data-Center/default.aspx">Meta: Hyperion joint venture with Blue Owl (Beignet notes, 6.581%)</a> <a href="https://news.kilambi.com/leverage/issuer/beignet/">Kilambi: Beignet bond prices (Oct 30 2026 close 92.31, YTM 7.55%)</a> <a href="https://fred.stlouisfed.org/series/BAMLH0A0HYM2EY">FRED: ICE BofA US High Yield Index Effective Yield (BAMLH0A0HYM2EY)</a> <a href="https://fred.stlouisfed.org/series/BAA">FRED: Moody&#x27;s Seasoned Baa Corporate Bond Yield (BAA)</a> <a href="https://fred.stlouisfed.org/series/BAMLC0A3CAEY">FRED: ICE BofA single-A effective yield (BAMLC0A3CAEY)</a> <a href="https://www.federalreserve.gov/publications/files/financial-stability-report-20261113.pdf">Federal Reserve Financial Stability Report, Nov 13 2026, Box 2.2 &#x27;Leverage in the Data Center Buildout&#x27;</a> <a href="https://ai-industry-reviews.com/research/ai-data-center-debt-financing-statistics-2026/">AI Industry Reviews: AI data-center debt financing statistics 2026 (deal coupons)</a> <a href="https://computelaw.blog/deals/ai-data-center-securitization/">ComputeLaw: AI data-center securitization (Lake Mariner)</a> <a href="https://thenextweb.com/news/oracle-data-centre-16-billion-financing-stargate">The Next Web: Oracle $16B Stargate Michigan financing</a> <a href="https://www.sec.gov/Archives/edgar/data/789019/000119312526447173/d178557d8k.htm">SEC 8-K: Microsoft notes, Oct 29 2026</a> <a href="https://investor.oracle.com/investor-news/news-details/2026/Oracle-Announces-Pricing-of-20-Billion-of-Common-Stock-and-Senior-Notes/default.aspx">Oracle: pricing of $20B common stock and senior notes, Nov 2 2026</a> <a href="https://www.sec.gov/Archives/edgar/data/1326801/000119312526450074/d166273d8k.htm">SEC 8-K: Meta notes, Nov 3 2026</a> <a href="https://www.ainvest.com/news/blackstone-qts-walked-500-million-protect-borrowing-price-2611/">AInvest, Nov 13 2026: Blackstone&#x27;s QTS walked away from $500M to protect its borrowing price</a> <a href="https://x.com/KobeissiLetter/status/2119879354045915540">X: Kobeissi Letter, $4.49T of off-balance-sheet AI obligations</a> <a href="https://x.com/unusual_whales/status/2120950252513759625">X: unusual_whales, Nvidia&#x27;s $36B of off-balance-sheet neocloud backstops</a></p></figcaption></figure></main></body></html>
