<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Data Center Hypergrowth Graphs — Q10</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q10")</script></head><body><main id="issue"><h2 class="desk">Q10. Build Pace</h2><figure class="g w"><img src="img/W2026-11-15-N10.webp" alt="US data-center construction nearly doubled in a year as factory building fell 18%" loading="lazy"><figcaption><span class="t">US data-center construction nearly doubled in a year as factory building fell 18%</span><p>Value of private construction put in place, seasonally adjusted annual rate, January 2021 – September 2026 (US Census Bureau; September is preliminary). Data-center construction reached $96.5 billion in September 2026, up 90% from a year earlier and more than double general office building ($46.0B). It now accounts for 12.2% of all private nonresidential construction. The jump since May ($65.7B to $96.5B) is the largest four-month dollar increase in the series. Meanwhile manufacturing construction, the CHIPS/IRA-era boom, has fallen from $249B (Sep 2024) to $167B, and electric-power construction ($147B) is rising to serve the new load.</p><ul><li>Data-center construction, $ billion SAAR: Apr 61.9, May 65.7, Jun 72.7, Jul 80.7, Aug 88.8, Sep 96.5 (Jul and Aug revised; Sep preliminary).</li><li>Data-center spending was $9.3B SAAR in January 2021, so it has grown about 10-fold.</li><li>Census values measure the buildings and site work, not the chips and servers inside, which cost several times more; the Fed&#x27;s November Financial Stability Report counts more than $680 billion of advanced-computing debt issued by October 2026.</li><li>Earlier TVV daily graphs (Oct 31) compared data centers with offices since 1993; this chart instead shows the hand-off from factories to data centers since 2021.</li></ul><p class="nt">Note: Census monthly construction spending is survey-based and revised; the latest two months are revised again next month. &#x27;Data center&#x27; is a sub-category of Office in the Census classification, published since 2014.</p><p>Sources: <a href="https://www.census.gov/construction/c30/xlsx/privsatime.xlsx">US Census Bureau: Value of Private Construction Put in Place, seasonally adjusted annual rate (privsatime.xlsx)</a> <a href="https://www.census.gov/construction/c30/c30index.html">US Census Bureau: Construction Spending (C30) main page and release schedule</a> <a href="https://www.federalreserve.gov/publications/files/financial-stability-report-20261113.pdf">Federal Reserve Financial Stability Report, Nov 2026 (Box: Leverage in the Data Center Buildout)</a></p></figcaption></figure></main></body></html>
